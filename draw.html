<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Skippy Draw Tool</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
    overflow: hidden;

    background-image: url('./reference.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;

    background-color: #000;

    cursor: crosshair;

    font-family: monospace;
    }

    canvas {
      display: block;
    }

    .ui {

      position: fixed;
      top: 20px;
      left: 20px;

      z-index: 100;

      color: white;

      background: rgba(0,0,0,.75);

      border: 1px solid rgba(255,255,255,.1);

      padding: 14px;

      width: 340px;

      backdrop-filter: blur(10px);
    }

    button {

      background: #111;
      color: white;

      border: 1px solid rgba(255,255,255,.2);

      padding: 8px 12px;

      margin-right: 8px;
      margin-top: 8px;

      cursor: pointer;
    }

    textarea {

      width: 100%;
      height: 160px;

      margin-top: 12px;

      background: #050505;
      color: #00ff99;

      border: 1px solid rgba(255,255,255,.1);

      padding: 10px;

      resize: none;
    }

    .title {
      margin-bottom: 10px;
      font-size: 14px;
      opacity: .8;
      line-height: 1.5;
    }

  </style>
</head>

<body>

  <div class="ui">

    <div class="title">
      CLICK TO CREATE POINTS<br>
      Press ENTER to finish a path<br>
      Press BACKSPACE to undo<br>
      Press C to clear everything
    </div>

    <button id="copyBtn">COPY POINTS</button>

    <textarea id="output"></textarea>

  </div>

  <canvas id="canvas"></canvas>

  <script>

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const output = document.getElementById("output");

    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;

    let paths = [[]];

    window.addEventListener("resize", () => {

      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;

      draw();
    });

    /* CLICK */

    canvas.addEventListener("click", (e) => {

      const x = e.clientX;
      const y = e.clientY;

      paths[paths.length - 1].push([x, y]);

      updateOutput();
      draw();
    });

    /* KEYS */

    window.addEventListener("keydown", (e) => {

      /* NEW PATH */

      if (e.key === "Enter") {

        paths.push([]);

        draw();
      }

      /* UNDO */

      if (e.key === "Backspace") {

        e.preventDefault();

        const current = paths[paths.length - 1];

        if (current.length > 0) {

          current.pop();

        } else if (paths.length > 1) {

          paths.pop();
        }

        updateOutput();
        draw();
      }

      /* CLEAR */

      if (e.key.toLowerCase() === "c") {

        paths = [[]];

        updateOutput();
        draw();
      }
    });

    /* COPY */

    document.getElementById("copyBtn")
      .addEventListener("click", async () => {

      await navigator.clipboard.writeText(
        JSON.stringify(paths, null, 2)
      );

      alert("Copied!");
    });

    /* OUTPUT */

    function updateOutput() {

      output.value =
        JSON.stringify(paths, null, 2);
    }

    /* DRAW */

    function draw() {

      ctx.clearRect(0,0,w,h);

      /* GRID */

      ctx.strokeStyle = "rgba(255,255,255,.03)";
      ctx.lineWidth = 1;

      for (let x = 0; x < w; x += 50) {

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,h);
        ctx.stroke();
      }

      for (let y = 0; y < h; y += 50) {

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(w,y);
        ctx.stroke();
      }

      /* PATHS */

      paths.forEach(path => {

        if (path.length < 1) return;

        ctx.beginPath();

        path.forEach((point, i) => {

          const [x,y] = point;

          if (i === 0) {

            ctx.moveTo(x,y);

          } else {

            ctx.lineTo(x,y);
          }
        });

        ctx.strokeStyle = "white";
        ctx.lineWidth = 2;

        ctx.stroke();

        /* POINTS */

        path.forEach(point => {

          ctx.beginPath();

          ctx.arc(
            point[0],
            point[1],
            4,
            0,
            Math.PI * 2
          );

          ctx.fillStyle = "#00ff99";

          ctx.fill();
        });
      });
    }

    draw();

  </script>

</body>
</html>
